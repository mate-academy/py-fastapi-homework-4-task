name: CI Pipeline

on:
  pull_request:
    branches:
      - "main"

jobs:
  test-accounts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run flake8
        run: |
          poetry run flake8 src

      - name: Run accounts tests
        run: |
          poetry run pytest src/tests/test_integration/test_accounts.py

  test-movies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run flake8
        run: |
          poetry run flake8 src

      - name: Run movies tests
        run: |
          poetry run pytest src/tests/test_integration/test_movies.py

  test-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run flake8
        run: |
          poetry run flake8 src

      - name: Run profiles tests
        run: |
          poetry run pytest src/tests/test_integration/test_profiles.py

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start Docker Compose
        run: |
          docker compose -f docker-compose-tests.yml up -d --build

      - name: Wait for MinIO
        run: |
          for i in {1..30}; do
            docker compose -f docker-compose-tests.yml exec -T minio \
              sh -c 'curl -f http://127.0.0.1:9000/minio/health/ready' \
              && break
            sleep 2
          done

      - name: Run e2e tests
        run: |
          docker compose -f docker-compose-tests.yml exec -T web \
            pytest -c /usr/src/config/pytest.ini \
            -m e2e \
            --maxfail=5 \
            --disable-warnings \
            -v \
            --tb=short

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose-tests.yml logs \
            --no-color \
            --timestamps \
            --tail=300

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose-tests.yml down
