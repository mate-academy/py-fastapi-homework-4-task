version: "2.4"

services:
  web:
    build:
      context: .
      dockerfile: ./docker/tests/Dockerfile
    container_name: backend_theater_test
    command: [ "pytest", "-c", "/usr/src/config/pytest.ini", "-m", "e2e", "--disable-warnings", "-v" ]
    environment:
      - PYTHONPATH=/usr/src/fastapi
      - ENVIRONMENT=testing
      - DATABASE_URL=sqlite+aiosqlite:///./test_db.sqlite
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
      - MINIO_HOST=minio-theater-test
      - MINIO_PORT=9000
      - MINIO_STORAGE=theater-storage
    depends_on:
      mailhog:
        condition: service_started
      minio:
        condition: service_healthy
      minio_mc:
        condition: service_healthy # Changed from completed_successfully
    volumes:
      - ./src:/usr/src/fastapi
    networks:
      - theater_network_test

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog_theater_test
    networks:
      - theater_network_test

  minio:
    image: minio/minio:latest
    container_name: minio-theater-test
    command: server /data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=some_password
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - theater_network_test

  minio_mc:
    build:
      context: .
      dockerfile: docker/minio_mc/Dockerfile
    container_name: minio_mc_theater_test
    command: ["/bin/sh", "-c", "/commands/setup_minio.sh && tail -f /dev/null"]
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/usr/bin/mc", "ls", "local/theater-storage" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 40s
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=some_password
      - MINIO_HOST=minio-theater-test
      - MINIO_PORT=9000
      - MINIO_STORAGE=theater-storage
    networks:
      - theater_network_test

networks:
  theater_network_test:
    driver: bridge
