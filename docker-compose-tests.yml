version: "3.8"

services:
  db:
    image: 'postgres:14.21-alpine'
    container_name: postgres_theater_test
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=theater_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d theater_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - theater_network_test

  web:
    build:
      context: .
      dockerfile: ./docker/tests/Dockerfile
    container_name: backend_theater_test
    command: [ "pytest", "-c", "/usr/src/config/pytest.ini", "-m", "e2e", "--disable-warnings", "-v" ]
    environment:
      - PYTHONPATH=/usr/src/fastapi
      - ENVIRONMENT=testing
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/theater_test
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
      - MINIO_HOST=minio-theater-test
      - MINIO_PORT=9000
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - theater_network_test

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog_theater_test
    ports:
      - "8025:8025"
    networks:
      - theater_network_test

  minio:
    image: minio/minio:latest
    container_name: minio-theater-test
    command: server --console-address ":9001" /data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=some_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - theater_network_test

  minio_mc:
    build:
      context: .
      dockerfile: docker/minio_mc/Dockerfile
    container_name: minio_mc_theater_test
    command: [ "/bin/sh", "-c", "/commands/setup_minio.sh" ]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=some_password
      - MINIO_HOST=minio-theater-test
      - MINIO_PORT=9000
      - MINIO_STORAGE=theater-storage
    networks:
      - theater_network_test

networks:
  theater_network_test:
    driver: bridge
